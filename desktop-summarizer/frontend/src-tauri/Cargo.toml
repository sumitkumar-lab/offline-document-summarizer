[package]
name = "offline-document-summarizer"
version = "0.4.0"
description = "Private offline document summarization desktop app"
authors = ["Offline Document Summarizer"]
license = ""
repository = ""
edition = "2021"

[lib]
name = "offline_document_summarizer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.4", features = [] }

[dependencies]
tauri = { version = "2.1.1", features = [] }
tauri-plugin-dialog = "2.2.0"
tauri-plugin-fs = "2.2.0"
tauri-plugin-shell = "2.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
